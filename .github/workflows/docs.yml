# Publica o manual (Documentation~/manual) e a referência da API (Documentation~/api) no GitHub Pages
# (ADR 0025 e 0040, tickets 0M-09 e RC5). Só manual/ e api/ viram site: prd/, spec/, adr/, planos/,
# backlog e AGENTS.md não são publicados. Nenhum passo usa a Unity nem secret: a API sai dos YAML commitados.
# Em pull request, o build roda inteiro e nada é publicado.
# Passo manual do dono do repositório: Settings > Pages > Source: GitHub Actions.
name: docs

on:
  push:
    branches: [main]
    paths:
      - "Documentation~/manual/**"
      - "Documentation~/mkdocs.yml"
      - "Documentation~/requirements-docs.txt"
      - "Documentation~/api/**"
      - "Documentation~/.config/**"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "Documentation~/manual/**"
      - "Documentation~/mkdocs.yml"
      - "Documentation~/requirements-docs.txt"
      - "Documentation~/api/**"
      - "Documentation~/.config/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

# Permissões mínimas do workflow; o job de publicação pede as do Pages.
permissions:
  contents: read

# Uma publicação por vez; a mais nova substitui a pendente, sem cancelar a em curso.
# Em pull request, cada PR tem o próprio grupo e não espera a fila do Pages.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('docs-pr-{0}', github.event.pull_request.number) || 'pages' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Documentation~/requirements-docs.txt

      - name: Instalar MkDocs e Material (versões travadas)
        run: pip install -r Documentation~/requirements-docs.txt

      # Roda de dentro de Documentation~/: o pymdownx.snippets inclui os exemplos a partir de "..", a raiz do repositório.
      - name: Gerar o site (--strict falha em link quebrado ou exemplo sem arquivo)
        working-directory: Documentation~
        run: mkdocs build --strict -f mkdocs.yml -d "${RUNNER_TEMP}/site"

      - name: .NET (SDK travado)
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.110"

      - name: Enviar o artefato do Pages
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/site

  # Só publica no push para a main; em pull request e no workflow_dispatch de outra branch, não.
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
