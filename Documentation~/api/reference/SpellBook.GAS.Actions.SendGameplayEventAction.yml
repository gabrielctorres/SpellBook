  type: Class
  namespace: SpellBook.GAS.Actions
  summary: >-
    Envia o evento de gameplay <xref href="SpellBook.GAS.Actions.SendGameplayEventAction.Tag" data-throw-if-not-resolved="false"></xref> ao ASC de cada alvo, com <xref href="SpellBook.GAS.Actions.ActionContext.Owner" data-throw-if-not-resolved="false"></xref> como

    instigador, o próprio alvo como unidade do evento e <xref href="SpellBook.GAS.Actions.SendGameplayEventAction.Magnitude" data-throw-if-not-resolved="false"></xref> avaliada no nível do contexto. Numa

    lista de efeito, o evento leva o contexto do efeito.
