  nameWithType: ShowIfDrawer
  fullName: SpellBook.Core.Editor.Inspector.ShowIfDrawer
  type: Class
  namespace: SpellBook.Core.Editor.Inspector
  summary: >-
    Drawer do <xref href="SpellBook.Core.Inspector.ShowIfAttribute" data-throw-if-not-resolved="false"></xref>. Monta o campo pelo tipo da propriedade (forma (b) da Spec, 4.10), porque a

    <xref href="UnityEditor.UIElements.PropertyField" data-throw-if-not-resolved="false"></xref> pública não contorna o drawer e cairia de novo aqui (risco 25). A visibilidade segue o

    irmão por <code>TrackPropertyValue</code>.
  example: []
  syntax:
    content: >-
      [CustomPropertyDrawer(typeof(ShowIfAttribute))]

      public sealed class ShowIfDrawer : PropertyDrawer
    content.vb: >-
      <CustomPropertyDrawer(GetType(ShowIfAttribute))>

      Public NotInheritable Class ShowIfDrawer Inherits PropertyDrawer
