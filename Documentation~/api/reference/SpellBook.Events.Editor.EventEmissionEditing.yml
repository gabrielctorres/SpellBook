  type: Method
  namespace: SpellBook.Events.Editor
  summary: >-
    Põe <code class="paramref">channel</code> na emissão de <code class="paramref">emission</code> e aplica. Com o mesmo tipo de payload,

    troca só o canal e mantém o payload; com outro tipo, recria a emissão por <xref href="SpellBook.Events.EventEmission.CreateFor(SpellBook.Events.EventChannel)" data-throw-if-not-resolved="false"></xref>.

    Com canal nulo, mantém a emissão (e o payload) sem canal.
