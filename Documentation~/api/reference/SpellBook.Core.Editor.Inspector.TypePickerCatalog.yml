  name: FindTypeDrawer(Type)
  nameWithType: TypePickerCatalog.FindTypeDrawer(Type)
  fullName: SpellBook.Core.Editor.Inspector.TypePickerCatalog.FindTypeDrawer(System.Type)
  type: Method
  namespace: SpellBook.Core.Editor.Inspector
  summary: >-
    Drawer de tipo (<code>[CustomPropertyDrawer]</code>) do tipo concreto, ou <code>null</code> se não há (ADR 0026, emenda de

    2026-11-01). Vale primeiro o drawer do tipo exato, depois o da base mais próxima com <code>useForChildren</code>. Drawers

    de <xref href="UnityEngine.PropertyAttribute" data-throw-if-not-resolved="false"></xref> ficam de fora; no empate, vence o de nome completo menor (ordinal).

    O resultado fica em cache até a recarga de domínio.
  example: []
  syntax:
    content: public static Type FindTypeDrawer(Type type)
    parameters:
    - id: type
      type: System.Type
    return:
      type: System.Type
    content.vb: Public Shared Function FindTypeDrawer(type As Type) As Type
  overload: SpellBook.Core.Editor.Inspector.TypePickerCatalog.FindTypeDrawer*
