  summary: >-
    Consulta sobre um conjunto de tags: casa se o conjunto tem <xref href="SpellBook.Tags.GameplayTagQuery.All?text=todas" data-throw-if-not-resolved="false"></xref> as tags,

    <xref href="SpellBook.Tags.GameplayTagQuery.Any?text=alguma" data-throw-if-not-resolved="false"></xref> delas (se a lista não é vazia) e <xref href="SpellBook.Tags.GameplayTagQuery.None?text=nenhuma" data-throw-if-not-resolved="false"></xref> das

    proibidas. Usa a regra de <xref href="SpellBook.Tags.GameplayTag.Matches(SpellBook.Tags.GameplayTag)" data-throw-if-not-resolved="false"></xref>: uma tag filha satisfaz o pai.

    Lista vazia não restringe. Tag inválida nunca casa. As consultas não alocam.
