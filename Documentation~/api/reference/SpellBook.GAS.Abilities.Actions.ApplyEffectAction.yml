  type: Class
  namespace: SpellBook.GAS.Abilities.Actions
  summary: >-
    Aplica os efeitos com a habilidade, o nível e o ponto do contexto (<xref href="SpellBook.GAS.Effects.EffectSpec.FromAbility(SpellBook.GAS.Effects.GameplayEffect%2cSpellBook.GAS.Actions.ActionContext)" data-throw-if-not-resolved="false"></xref>) nos alvos

