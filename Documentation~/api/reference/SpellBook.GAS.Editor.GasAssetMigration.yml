  langs:
  - csharp
  - vb
  name: GasAssetMigration
  nameWithType: GasAssetMigration
  fullName: SpellBook.GAS.Editor.GasAssetMigration
  type: Class
  namespace: SpellBook.GAS.Editor
  summary: >-
    Regrava os <xref href="SpellBook.GAS.Effects.GameplayEffect" data-throw-if-not-resolved="false"></xref> e os <xref href="SpellBook.GAS.Abilities.GameplayAbility" data-throw-if-not-resolved="false"></xref> do projeto no formato 3.0 (ADR 0009,

    VN3, EV3d). A conversão dos campos 2.x (<code>Duration</code> e <code>ConstantValue</code> do efeito e <code>Duration</code> da

    <code>WaitAction</code>, em <code>float</code>) roda no carregamento; este menu só marca os assets como sujos e salva, para o

    YAML perder os valores legados. Rodar de novo não muda nada.
  example: []
  syntax:
    content: public static class GasAssetMigration
    content.vb: Public Module GasAssetMigration
