- uid: SpellBook.GAS.Editor.GasAssetMigration.MigrateAll
  commentId: M:SpellBook.GAS.Editor.GasAssetMigration.MigrateAll
  id: MigrateAll
  parent: SpellBook.GAS.Editor.GasAssetMigration
  langs:
  - csharp
  - vb
  name: MigrateAll()
  nameWithType: GasAssetMigration.MigrateAll()
  fullName: SpellBook.GAS.Editor.GasAssetMigration.MigrateAll()
  type: Method
  namespace: SpellBook.GAS.Editor
  summary: >-
    Carrega e regrava todo <xref href="SpellBook.GAS.Effects.GameplayEffect" data-throw-if-not-resolved="false"></xref> e todo <xref href="SpellBook.GAS.Abilities.GameplayAbility" data-throw-if-not-resolved="false"></xref> em <code>Assets/</code> e

    nos pacotes embutidos ou locais (os pacotes do registro são só leitura e ficam de fora). Devolve a soma dos

    efeitos e das habilidades regravados.
  example: []
  syntax:
    content: public static int MigrateAll()
    return:
      type: System.Int32
    content.vb: Public Shared Function MigrateAll() As Integer
  overload: SpellBook.GAS.Editor.GasAssetMigration.MigrateAll*
