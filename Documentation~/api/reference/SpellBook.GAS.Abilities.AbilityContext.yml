  fullName: SpellBook.GAS.Abilities.AbilityContext.WaitSeconds(float)
  type: Method
  namespace: SpellBook.GAS.Abilities
  summary: >-
    Espera, quadro a quadro, até o <xref href="SpellBook.GAS.Core.AbilitySystemComponent.TickedTime" data-throw-if-not-resolved="false"></xref> do <xref href="SpellBook.GAS.Abilities.AbilityContext.Source" data-throw-if-not-resolved="false"></xref>

    avançar <code class="paramref">seconds</code>. Não lê o relógio da Unity: com o ASC parado, a espera não anda.

    Termina na hora se <code class="paramref">seconds</code> não for positivo ou se o ASC for destruído.
