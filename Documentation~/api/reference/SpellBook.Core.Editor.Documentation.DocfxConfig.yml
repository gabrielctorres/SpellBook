  commentId: M:SpellBook.Core.Editor.Documentation.DocfxConfig.Render(System.Collections.Generic.IEnumerable{SpellBook.Core.Editor.Documentation.DocfxAssembly},System.Collections.Generic.IReadOnlyCollection{System.String},System.String)
  id: Render(System.Collections.Generic.IEnumerable{SpellBook.Core.Editor.Documentation.DocfxAssembly},System.Collections.Generic.IReadOnlyCollection{System.String},System.String)
  parent: SpellBook.Core.Editor.Documentation.DocfxConfig
  langs:
  - csharp
  - vb
  name: Render(IEnumerable<DocfxAssembly>, IReadOnlyCollection<string>, string)
  nameWithType: DocfxConfig.Render(IEnumerable<DocfxAssembly>, IReadOnlyCollection<string>, string)
  fullName: SpellBook.Core.Editor.Documentation.DocfxConfig.Render(System.Collections.Generic.IEnumerable<SpellBook.Core.Editor.Documentation.DocfxAssembly>, System.Collections.Generic.IReadOnlyCollection<string>, string)
  type: Method
  namespace: SpellBook.Core.Editor.Documentation
  summary: >-
    Texto do <code>docfx.metadata.json</code>. As fontes ficam relativas a <code class="paramref">configDir</code>; as referências são

    as DLLs dos assemblies do pacote, sem as saídas deles e sem as que estão em <code class="paramref">systemAssemblyDirectories</code>,

    porque o DocFX já traz a biblioteca base do .NET. Listas em ordem ordinal, barras <code>/</code> e quebras <code>\n</code>.
  example: []
  syntax:
    content: public static string Render(IEnumerable<DocfxAssembly> assemblies, IReadOnlyCollection<string> systemAssemblyDirectories, string configDir)
    parameters:
    - id: assemblies
      type: System.Collections.Generic.IEnumerable{SpellBook.Core.Editor.Documentation.DocfxAssembly}
    - id: systemAssemblyDirectories
      type: System.Collections.Generic.IReadOnlyCollection{System.String}
    - id: configDir
      type: System.String
    return:
      type: System.String
    content.vb: Public Shared Function Render(assemblies As IEnumerable(Of DocfxAssembly), systemAssemblyDirectories As IReadOnlyCollection(Of String), configDir As String) As String
