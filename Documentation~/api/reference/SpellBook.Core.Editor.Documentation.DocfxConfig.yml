  nameWithType: DocfxConfig.ReadSystemAssemblyDirectories()
  fullName: SpellBook.Core.Editor.Documentation.DocfxConfig.ReadSystemAssemblyDirectories()
  type: Method
  namespace: SpellBook.Core.Editor.Documentation
  summary: Pastas da biblioteca base do .NET da Unity para os níveis de compatibilidade dos assemblies do pacote, em caminho completo.
  remarks: >-
    Cada assembly entra com dois níveis: o da API (<xref href="UnityEditor.Compilation.ScriptCompilerOptions.ApiCompatibilityLevel" data-throw-if-not-resolved="false"></xref>) e o dos

    assemblies de Editor (<xref href="UnityEditor.Compilation.ScriptCompilerOptions.EditorAssembliesCompatibilityLevel" data-throw-if-not-resolved="false"></xref>).
