  summary: >-
    Dispara outro canal. Em <xref href="SpellBook.Events.RaiseChannelReaction.Mode.ForwardPayload" data-throw-if-not-resolved="false"></xref>, repassa o payload recebido a um canal do mesmo tipo

    (de outro tipo, não dispara). Em <xref href="SpellBook.Events.RaiseChannelReaction.Mode.RaiseVoid" data-throw-if-not-resolved="false"></xref>, dispara um <xref href="SpellBook.Events.VoidEventChannel" data-throw-if-not-resolved="false"></xref>.
  example: []
  syntax:
    content: >-
      [Serializable]

      [TypeCategory("Eventos", Summary = "Dispara outro canal, repassando ou não o payload.")]

      public sealed class RaiseChannelReaction : Reaction, IValidatable
