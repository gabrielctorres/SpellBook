    - id: value
      type: System.Single
    - id: op
      type: SpellBook.GAS.Attributes.ModifierOperation
    - id: culture
      type: System.IFormatProvider
    return:
      type: System.String
    content.vb: Public Function Format(value As Single, op As ModifierOperation, culture As IFormatProvider = Nothing) As String
