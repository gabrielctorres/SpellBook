  langs:
  - csharp
  - vb
  name: Format(float, ModifierOperation, IFormatProvider)
  nameWithType: AttributeDisplay.Format(float, ModifierOperation, IFormatProvider)
  fullName: SpellBook.GAS.Attributes.AttributeDisplay.Format(float, SpellBook.GAS.Attributes.ModifierOperation, System.IFormatProvider)
  type: Method
  namespace: SpellBook.GAS.Attributes
  summary: >-
    Texto do valor de um modificador: <code>Add</code> e <code>AddFinal</code> com sinal explícito, pelo tipo;

    <code>Multiply</code> e <code>MultiplyCompound</code> em porcentagem com sinal (0,5 = "+50%"), sem prefixo nem sufixo,

    porque são variação relativa; <code>Override</code> sem sinal, pelo tipo. Cultura nula usa <xref href="System.Globalization.CultureInfo.InvariantCulture" data-throw-if-not-resolved="false"></xref>.
  example: []
  syntax:
    content: public string Format(float value, ModifierOperation op, IFormatProvider culture = null)
