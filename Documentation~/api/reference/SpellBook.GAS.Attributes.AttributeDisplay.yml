- uid: SpellBook.GAS.Attributes.AttributeDisplay.Format(System.Single,SpellBook.GAS.Attributes.ModifierOperation,System.IFormatProvider)
  commentId: M:SpellBook.GAS.Attributes.AttributeDisplay.Format(System.Single,SpellBook.GAS.Attributes.ModifierOperation,System.IFormatProvider)
