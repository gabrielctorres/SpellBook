  name: DamagePreviewModel
  nameWithType: DamagePreviewModel
  fullName: SpellBook.GAS.Editor.DamagePreviewModel
  type: Class
  namespace: SpellBook.GAS.Editor
  summary: >-
    Prévia "dano → processadores → alterações" do <xref href="SpellBook.GAS.Editor.AttributeDefinitionEditor" data-throw-if-not-resolved="false"></xref> (ADR 0033). Roda o mesmo

    pipeline do jogo, pelo <xref href="SpellBook.GAS.Core.AbilitySystemComponent.ApplyAttributeChange(SpellBook.GAS.Attributes.AttributeDefinition%2cSystem.Single%2cSpellBook.GAS.Effects.EffectContext%40%2cSpellBook.GAS.Effects.GameplayEffect)" data-throw-if-not-resolved="false"></xref>, num ASC temporário oculto

    (<xref href="UnityEngine.HideFlags.HideAndDontSave" data-throw-if-not-resolved="false"></xref>) com o atributo e os atributos que os processadores citam. O ASC nasce

    com o modelo e é destruído no <xref href="SpellBook.GAS.Editor.DamagePreviewModel.Dispose" data-throw-if-not-resolved="false"></xref>.
