- uid: SpellBook.GAS.Conditions.CastRangeCondition
  commentId: T:SpellBook.GAS.Conditions.CastRangeCondition
  id: CastRangeCondition
  parent: SpellBook.GAS.Conditions
  children:
  - SpellBook.GAS.Conditions.CastRangeCondition.DefaultFailureKey
  - SpellBook.GAS.Conditions.CastRangeCondition.Evaluate(SpellBook.GAS.Conditions.ConditionContext@)
