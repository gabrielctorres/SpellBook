  name: CastRangeCondition
  nameWithType: CastRangeCondition
  fullName: SpellBook.GAS.Conditions.CastRangeCondition
  type: Class
  namespace: SpellBook.GAS.Conditions
  summary: >-
    Verdadeira se o alvo está a até <xref href="SpellBook.GAS.Abilities.GameplayAbility.CastRange" data-throw-if-not-resolved="false"></xref> (avaliado no nível do contexto) da

    posição do <xref href="SpellBook.GAS.Conditions.ConditionContext.Owner" data-throw-if-not-resolved="false"></xref>. Com unidade, mede até ela pelo <xref href="SpellBook.GAS.Conditions.CastRangeCondition.Measure" data-throw-if-not-resolved="false"></xref>; sem

    unidade, até o ponto. Alcance ≤ 0, ou sem habilidade, é "sem limite": verdadeira, com ou sem alvo. Com

    alcance &gt; 0, sem ponto ou sem dono, é falsa.
  example: []
  syntax:
    content: >-
      [Serializable]

      [TypeCategory("Alvos", Summary = "O alvo está dentro do alcance da habilidade.", Line = "Dentro do alcance")]

      public sealed class CastRangeCondition : Condition<ConditionContext>
    content.vb: >-
      <Serializable>

      <TypeCategory("Alvos", Summary:="O alvo está dentro do alcance da habilidade.", Line:="Dentro do alcance")>

      Public NotInheritable Class CastRangeCondition Inherits Condition(Of ConditionContext)
