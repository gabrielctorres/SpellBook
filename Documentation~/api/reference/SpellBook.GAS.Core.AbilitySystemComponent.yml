  summary: >-
    Grava a contagem de pilhas, limitada a <code>[0, MaxStacks]</code> (<code>MaxStacks</code> menor que 1 vale 1), e dispara

    <xref href="SpellBook.GAS.Core.AbilitySystemComponent.OnEffectStacksChanged" data-throw-if-not-resolved="false"></xref>. Zero remove a instância com <xref href="SpellBook.GAS.Effects.EffectRemovalReason.StacksDepleted" data-throw-if-not-resolved="false"></xref>,

    depois da limpeza e do evento de pilhas. Tags e modificadores seguem um por instância; com

    <xref href="SpellBook.GAS.Effects.GameplayEffect.StacksMultiplyMagnitude" data-throw-if-not-resolved="false"></xref>, o valor de cada modificador acompanha as pilhas.
