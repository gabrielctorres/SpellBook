    <code class="paramref">owner</code> é o dono lógico, usado por <xref href="SpellBook.GAS.Core.AbilitySystemComponent.CancelActions(System.Object)" data-throw-if-not-resolved="false"></xref>; nulo deixa a execução sem dono.
