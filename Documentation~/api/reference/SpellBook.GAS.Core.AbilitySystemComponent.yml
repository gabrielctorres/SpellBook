    Tira <code class="paramref">seconds</code> de toda instância que conta para a recarga da habilidade (o próprio

    <code>CooldownEffect</code> ou uma tag filha); as que chegam a zero expiram. Com cargas, tira também da recarga da carga

    em curso, que pode devolver mais de uma carga. Segundos negativos ou NaN são ignorados com aviso. Habilidade nula,

    sem recarga ou pronta: <code>false</code>.
