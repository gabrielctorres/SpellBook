    <code>((base + ΣAdd) × (1 + ΣMultiply)) × Π(1 + MultiplyCompound) + ΣAddFinal</code>, depois o último

    <code>Override</code> e, por fim, o limite. Serializado como inteiro: valores novos entram só no fim.
