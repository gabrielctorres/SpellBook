- uid: SpellBook.GAS.Bridges.RaiseEventAction
  commentId: T:SpellBook.GAS.Bridges.RaiseEventAction
  id: RaiseEventAction
  parent: SpellBook.GAS.Bridges
  children:
  - SpellBook.GAS.Bridges.RaiseEventAction.Execute(SpellBook.GAS.Abilities.AbilityContext)
  - SpellBook.GAS.Bridges.RaiseEventAction.Validate(SpellBook.Core.Validation.ValidationResult)
  langs:
  - csharp
  - vb
  name: RaiseEventAction
  nameWithType: RaiseEventAction
  fullName: SpellBook.GAS.Bridges.RaiseEventAction
  type: Class
  namespace: SpellBook.GAS.Bridges
  summary: >-
    Dispara um canal de eventos uma vez e termina no mesmo quadro. O payload é o fixo da emissão ou, com outra

    <xref href="SpellBook.GAS.Bridges.GasPayloadSource" data-throw-if-not-resolved="false"></xref>, um valor lido do <xref href="SpellBook.GAS.Abilities.AbilityContext" data-throw-if-not-resolved="false"></xref> na hora. O ASC que conjurou aparece

    como quem disparou. Sem emissão, sem canal, com fonte incompatível com o canal ou sem valor para enviar (sem

    conjurador, sem o atributo, sem alvo válido), não dispara nada, e a validação acusa o que é configuração.
  example: []
  syntax:
    content: >-
      [HelpURL("https://gabrielctorres.github.io/SpellBook/modulos/gas/#raiseeventaction")]

      [Serializable]

      [TypeCategory("Eventos", Summary = "Dispara um canal de eventos com um payload fixo ou da habilidade.")]

      public sealed class RaiseEventAction : AbilityAction, IValidatable
    content.vb: >-
      <HelpURL("https://gabrielctorres.github.io/SpellBook/modulos/gas/#raiseeventaction")>

      <Serializable>

      <TypeCategory("Eventos", Summary:="Dispara um canal de eventos com um payload fixo ou da habilidade.")>

