  summary: >-
    Dados de uma execução de ações. O ASC guarda os contextos em pool: depois de passar um contexto a

    <xref href="SpellBook.GAS.Core.AbilitySystemComponent.RunActions(System.Collections.Generic.IReadOnlyList%7bSpellBook.GAS.Actions.GameplayAction%7d%2cSpellBook.GAS.Actions.ActionContext%2cSystem.Object)" data-throw-if-not-resolved="false"></xref>, o executor fica com ele e o devolve ao pool quando a execução

    termina ou é cancelada. Não guarde a referência depois disso.
