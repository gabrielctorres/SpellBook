  namespace: SpellBook.GAS.Attributes
  summary: >-
    Reduz a alteração pelo valor atual de um atributo do dono (resistência, armadura), só para efeitos com alguma das

    <xref href="SpellBook.GAS.Attributes.ReduceByAttribute.DamageTags" data-throw-if-not-resolved="false"></xref>. Atributo ausente no dono: não faz nada.
  example: []
  syntax:
