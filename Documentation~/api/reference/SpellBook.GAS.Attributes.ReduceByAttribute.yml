      [Serializable]

      [TypeCategory("Dano/Redução", Summary = "Reduz a alteração pelo valor de um atributo do dono.", Line = "{sourceAttribute} {mode}{onlyNegative? (só dano)}")]

      [HelpURL("https://gabrielctorres.github.io/SpellBook/modulos/dano-escudo-e-morte/")]

      public sealed class ReduceByAttribute : AttributeChangeProcessor
    content.vb: >-
      <Serializable>

      <TypeCategory("Dano/Redução", Summary:="Reduz a alteração pelo valor de um atributo do dono.", Line:="{sourceAttribute} {mode}{onlyNegative? (só dano)}")>

