  name: AttributeThresholdCondition
  nameWithType: AttributeThresholdCondition
  fullName: SpellBook.GAS.Conditions.AttributeThresholdCondition
  type: Class
  namespace: SpellBook.GAS.Conditions
  summary: >-
    Compara o valor atual de um atributo do <xref href="SpellBook.GAS.Conditions.ConditionContext.Owner" data-throw-if-not-resolved="false"></xref> com um valor (ou, com

    <xref href="SpellBook.GAS.Conditions.AttributeThresholdCondition.UseRatio" data-throw-if-not-resolved="false"></xref>, o valor dividido pelo máximo efetivo). O valor é avaliado com um <xref href="SpellBook.GAS.Effects.EffectContext" data-throw-if-not-resolved="false"></xref>

    em que o dono é instigador e alvo, na habilidade e no nível do contexto. Atributo ausente ou sem dono: falsa, sem aviso.
  example: []
  syntax:
    content: >-
      [Serializable]

      [TypeCategory("Atributos", Summary = "Compara um atributo do dono com um valor.", Line = "{attribute} {comparison} {value.Value}{useRatio? (proporção)}")]

      public sealed class AttributeThresholdCondition : Condition<ConditionContext>
    content.vb: >-
      <Serializable>

      <TypeCategory("Atributos", Summary:="Compara um atributo do dono com um valor.", Line:="{attribute} {comparison} {value.Value}{useRatio? (proporção)}")>

      Public NotInheritable Class AttributeThresholdCondition Inherits Condition(Of ConditionContext)
