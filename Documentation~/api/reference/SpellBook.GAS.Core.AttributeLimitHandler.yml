  namespace: SpellBook.GAS.Core
  summary: >-
    Ouvinte de um atributo que chegou a um limite. <code class="paramref">cause</code> é o relatório da alteração do pipeline

    que o levou ao limite; sem ela (limite que mudou, modificador persistente), <code>IsValid</code> é falso.
