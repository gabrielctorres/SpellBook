  name: ActivationFailure
  nameWithType: ActivationFailure
  fullName: SpellBook.GAS.Abilities.ActivationFailure
  type: Struct
  namespace: SpellBook.GAS.Abilities
  summary: >-
    Resultado detalhado de uma checagem de ativação: o <xref href="SpellBook.GAS.Abilities.AbilityActivationResult" data-throw-if-not-resolved="false"></xref> e o motivo. Nas falhas de

    tag, <xref href="SpellBook.GAS.Abilities.ActivationFailure.ReasonTag" data-throw-if-not-resolved="false"></xref> é a tag que decidiu; nas de regra, a tag e a chave da <xref href="SpellBook.GAS.Abilities.ActivationRule" data-throw-if-not-resolved="false"></xref>. Nas

    demais (recarga, custo, cargas), não há tag nem chave: a UI mapeia o <xref href="SpellBook.GAS.Abilities.ActivationFailure.Result" data-throw-if-not-resolved="false"></xref>.
  example: []
  syntax:
    content: public readonly struct ActivationFailure
    content.vb: Public Structure ActivationFailure
