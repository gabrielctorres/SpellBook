  name: AbsorbWithAttribute
  nameWithType: AbsorbWithAttribute
  fullName: SpellBook.GAS.Attributes.AbsorbWithAttribute
  type: Class
  namespace: SpellBook.GAS.Attributes
  summary: >-
    Desvia parte do dano para um atributo de escudo do mesmo dono, até o escudo chegar ao mínimo. O escudo gasto é uma

    alteração redirecionada, aplicada antes da alteração original (ADR 0033, item 5). Só age em alterações negativas

    de efeitos com alguma das <xref href="SpellBook.GAS.Attributes.AbsorbWithAttribute.DamageTags" data-throw-if-not-resolved="false"></xref>; escudo ausente no dono: não faz nada.
  example: []
  syntax:
    content: >-
      [Serializable]

      [TypeCategory("Dano/Escudo", Summary = "Desvia o dano para um atributo de escudo do dono.", Line = "Escudo {shield} × {fraction}")]

      [HelpURL("https://gabrielctorres.github.io/SpellBook/modulos/dano-escudo-e-morte/")]

      public sealed class AbsorbWithAttribute : AttributeChangeProcessor
    content.vb: >-
      <Serializable>

      <TypeCategory("Dano/Escudo", Summary:="Desvia o dano para um atributo de escudo do dono.", Line:="Escudo {shield} × {fraction}")>

      <HelpURL("https://gabrielctorres.github.io/SpellBook/modulos/dano-escudo-e-morte/")>

      Public NotInheritable Class AbsorbWithAttribute Inherits AttributeChangeProcessor
