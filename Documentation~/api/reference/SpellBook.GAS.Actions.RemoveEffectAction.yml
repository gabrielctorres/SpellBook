  name: RemoveEffectAction
  nameWithType: RemoveEffectAction
  fullName: SpellBook.GAS.Actions.RemoveEffectAction
  type: Class
  namespace: SpellBook.GAS.Actions
  summary: >-
    Remove de cada alvo as instâncias de <xref href="SpellBook.GAS.Actions.RemoveEffectAction.Effect" data-throw-if-not-resolved="false"></xref> e as que concedem <xref href="SpellBook.GAS.Actions.RemoveEffectAction.Tag" data-throw-if-not-resolved="false"></xref> (ou uma filha dela),

    e grava a soma das pilhas removidas em <xref href="SpellBook.GAS.Actions.ActionContext.LastRemovedStacks" data-throw-if-not-resolved="false"></xref>. Sem efeito e sem tag, não

    remove nada e grava 0.
  example: []
  syntax:
    content: >-
      [Serializable]

      [TypeCategory("Efeito", Summary = "Remove dos alvos um efeito, ou os efeitos que concedem uma tag.")]

      public sealed class RemoveEffectAction : GameplayAction, IValidatable
    content.vb: >-
      <Serializable>

      <TypeCategory("Efeito", Summary:="Remove dos alvos um efeito, ou os efeitos que concedem uma tag.")>

      Public NotInheritable Class RemoveEffectAction Inherits GameplayAction Implements IValidatable
