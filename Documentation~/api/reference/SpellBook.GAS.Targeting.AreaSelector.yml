  name: AreaSelector
  nameWithType: AreaSelector
  fullName: SpellBook.GAS.Targeting.AreaSelector
  type: Class
  namespace: SpellBook.GAS.Targeting
  summary: >-
    Escolhe as unidades num raio em volta de um centro, com física 2D ou 3D. O ASC é procurado no collider ou nos

    pais, e cada unidade conta uma vez. O ASC que roda a lista (<xref href="SpellBook.GAS.Actions.ActionContext.Owner" data-throw-if-not-resolved="false"></xref>) fica de fora,

    a menos que <xref href="SpellBook.GAS.Targeting.AreaSelector.IncludeOwner" data-throw-if-not-resolved="false"></xref> esteja ligado. O <xref href="SpellBook.GAS.Targeting.AreaSelector.Filter" data-throw-if-not-resolved="false"></xref> decide, candidato a candidato, quem pode

    ser alvo (ADR 0035). A busca vê até 64 colliders.
  example: []
  syntax:
    content: >-
      [Serializable]

      [TypeCategory("Alvo", Summary = "Escolhe as unidades num raio, as mais perto ou sorteadas.", Line = "Área")]

      public sealed class AreaSelector : TargetSelector
    content.vb: >-
      <Serializable>

      <TypeCategory("Alvo", Summary:="Escolhe as unidades num raio, as mais perto ou sorteadas.", Line:="Área")>

      Public NotInheritable Class AreaSelector Inherits TargetSelector
