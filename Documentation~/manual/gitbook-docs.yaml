$schema: https://api.gitbook.com/gitbook-docs.yaml
site:
  title: Manual do SpellBook
  structure:
    - type: section
      key: section-manual
      title: Manual
      path: manual
      default: true
      children:
        - type: space
          key: space-inicio
          title: Manual do SpellBook
          path: inicio
          default: true
          content:
            directory: ./
        - type: space
          key: space-conceitos
          title: Conceitos
          path: conceitos
          content:
            directory: ./inicio
        - type: space
          key: space-modulos
          title: Módulos
          path: modulos
          content:
            directory: ./modulos
        - type: space
          key: space-exemplos
          title: Exemplos
          path: exemplos
          content:
            directory: ./exemplos
