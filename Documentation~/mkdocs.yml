# Site do manual público do SpellBook (ADR 0025). Só a pasta manual/ vira site.
# Ferramenta: MkDocs com o tema Material, versões travadas em requirements-docs.txt.
# Com nav explícito: o build falha se uma página ficar fora do nav ou se o nav apontar para página que não existe (ADR 0007, I26, emenda de 2026-11-01).
# Build, de dentro de Documentation~/: mkdocs build --strict -f mkdocs.yml
# O pymdownx.snippets resolve as inclusões a partir da pasta onde o MkDocs roda: ".." é a raiz do repositório.
site_name: SpellBook
site_url: https://gabrielctorres.github.io/SpellBook/
site_description: Manual do SpellBook, pacote de ferramentas reutilizáveis para Unity.
repo_url: https://github.com/gabrielctorres/SpellBook
docs_dir: manual
use_directory_urls: true

theme:
  name: material
  language: pt-BR
  features:
    - navigation.sections
    - navigation.footer

nav:
  - Começar:
      - index.md
      - inicio/instalacao.md
  - Sistemas de habilidade:
      - modulos/gas.md
      - modulos/dano-escudo-e-morte.md
  - Sistemas de apoio:
      - modulos/eventos.md
      - modulos/tags.md
      - modulos/tempo.md
      - modulos/pooling.md
  - Editor e ferramentas:
      - inicio/inspector.md
      - ferramentas/validador.md
      - ferramentas/gas-debugger.md
      - ferramentas/event-debugger.md
  - Exemplos:
      - exemplos/sandbox.md
  - Referência:
      - referencia/catalogo.md
      - API: https://gabrielctorres.github.io/SpellBook/api/
      - inicio/conceitos.md
      - regras/migracao-2-para-3.md

validation:
  nav:
    omitted_files: warn
    not_found: warn
  links:
    not_found: warn
    anchors: warn

markdown_extensions:
  - attr_list
  - admonition
  - toc
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  # Exemplos de código incluídos de arquivos de teste (Spec referencia-catalogo-e-api.md, D9; ADR 0041).
  - pymdownx.snippets:
      base_path: [".."]
      check_paths: true
      restrict_base_path: true
      dedent_subsections: true
